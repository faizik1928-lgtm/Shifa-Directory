<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Doctors – Shifa Directory</title>
  <meta name="description" content="View your saved and favourite doctors on Shifa Directory." />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="main.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0FA3A3" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🏥</div>
      <span class="logo-text">Shifa <span>Directory</span></span>
    </a>
    <div class="nav-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="navSearch" placeholder="Search doctor, specialty, hospital…" autocomplete="off" />
      <div class="search-suggestions hidden" id="navSuggestions"></div>
    </div>
    <div class="header-actions">
      <button class="emergency-btn" id="emergencyBtn">
        <div class="pulse"></div> Emergency
      </button>
      <a href="favorites.html" class="fav-btn" title="Saved Doctors" style="position:relative;">
        ❤️
        <span class="fav-count" id="headerFavCount" style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<!-- Emergency Modal -->
<div class="modal-overlay hidden" id="emergencyModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>🚨 Emergency Numbers</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="emergency-list" id="emergencyList"></div>
  </div>
</div>

<!-- PAGE HEADER -->
<section class="page-header">
  <div class="container">
    <h1>❤️ Saved Doctors</h1>
    <p>Your favourited doctors, all in one place</p>
  </div>
</section>

<!-- CONTENT -->
<div class="container" style="padding: 32px 20px 60px;">
  <div class="doctors-grid" id="favDoctorsGrid">
    <div class="spinner-wrap"><div class="spinner"></div></div>
  </div>
</div>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-bottom" style="padding-top:0;border-top:none">
      <p>© 2024 Shifa Directory.</p>
      <div class="disclaimer">⚠️ Please confirm timings with the clinic before visiting.</div>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="data.js"></script>
<script src="js/app.js"></script>
<script src="app.js"></script>
<script src="js/favorites.js"></script>
<script src="favorites.js"></script>
</body>
</html>
