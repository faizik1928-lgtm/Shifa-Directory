<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Profile – Shifa Directory</title>
  <meta name="description" content="View full doctor profile, contact information, timings, and qualifications on Shifa Directory." />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="main.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0FA3A3" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🏥</div>
      <span class="logo-text">Shifa <span>Directory</span></span>
    </a>
    <div class="nav-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="navSearch" placeholder="Search doctor, specialty, hospital…" autocomplete="off" />
      <div class="search-suggestions hidden" id="navSuggestions"></div>
    </div>
    <div class="header-actions">
      <button class="emergency-btn" id="emergencyBtn">
        <div class="pulse"></div> Emergency
      </button>
      <a href="favorites.html" class="fav-btn" title="Saved Doctors" style="position:relative;">
        ❤️
        <span class="fav-count" id="headerFavCount" style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<!-- Emergency Modal -->
<div class="modal-overlay hidden" id="emergencyModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>🚨 Emergency Numbers</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="emergency-list" id="emergencyList"></div>
  </div>
</div>

<!-- Breadcrumb -->
<div style="background:var(--bg);border-bottom:1px solid var(--border);padding:12px 20px;">
  <div class="container" style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--muted);">
    <a href="index.html" style="color:var(--primary);font-weight:600;">Home</a>
    <span>›</span>
    <a href="results.html" id="breadSpecialty" style="color:var(--primary);font-weight:600;">Doctors</a>
    <span>›</span>
    <span id="breadName">Loading…</span>
  </div>
</div>

<!-- PROFILE HERO -->
<section class="profile-hero">
  <div class="profile-card" id="profileCard">
    <div class="spinner-wrap" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>
</section>

<!-- PROFILE BODY -->
<div class="profile-body">
  <div class="container">
    <div style="display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;">

      <!-- Left column -->
      <div>
        <div class="profile-section" id="aboutSection" style="display:none">
          <h3>📋 About</h3>
          <p class="about-text" id="aboutText"></p>
        </div>

        <div class="profile-section" id="detailsSection" style="display:none">
          <h3>🏥 Details</h3>
          <div class="info-grid" id="infoGrid"></div>
        </div>

        <div class="profile-section" id="locationSection" style="display:none">
          <h3>📍 Location</h3>
          <p id="locAddress" style="font-size:0.92rem;margin-bottom:12px;"></p>
          <a id="mapLink" href="#" target="_blank" class="map-link">🗺️ Open in Google Maps</a>
        </div>
      </div>

      <!-- Right column -->
      <div>
        <div class="profile-section" id="timingsSection" style="display:none">
          <h3>🕐 Timings</h3>
          <div class="timings-grid" id="timingsGrid"></div>
        </div>

        <div class="profile-section" id="contactSection" style="display:none">
          <h3>📞 Contact</h3>
          <div id="contactGrid" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>

        <div class="profile-section" id="similarSection" style="display:none">
          <h3>👨‍⚕️ Similar Doctors</h3>
          <div id="similarList" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-bottom" style="padding-top:0;border-top:none">
      <p>© 2024 Shifa Directory.</p>
      <div class="disclaimer">⚠️ Please confirm timings with the clinic before visiting.</div>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="data.js"></script>
<script src="js/app.js"></script>
<script src="app.js"></script>
<script src="js/doctor.js"></script>
<script src="doctor.js"></script>
</body>
</html>
